- name: '#X Amz Target=StorageGateway 20130630.StartAvailabilityMonitorTest'
paths:
  /#X-Amz-Target=StorageGateway_20130630.StartAvailabilityMonitorTest:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartAvailabilityMonitorTest
      description: 'Start a test that verifies that the specified gateway is configured for High Availability monitoring in your host environment. This request only initiates the test and that a successful response only indicates that the test was started. It doesn''t indicate that the test passed. For the status of the test, invoke the DescribeAvailabilityMonitorTest API.


        Starting this test will cause your gateway to go offline for a brief period.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAvailabilityMonitorTestOutput'
        '480':
          description: InvalidGatewayRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidGatewayRequestException'
        '481':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAvailabilityMonitorTestInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StorageGateway_20130630.StartAvailabilityMonitorTest
      tags:
      - '#X Amz Target=StorageGateway 20130630.StartAvailabilityMonitorTest'
      summary: Start availability monitor test
      x-summary-source: derived
