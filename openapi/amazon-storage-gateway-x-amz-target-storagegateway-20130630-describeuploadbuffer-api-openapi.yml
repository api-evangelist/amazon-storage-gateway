tags:
- name: '#X Amz Target=StorageGateway 20130630.DescribeUploadBuffer'
paths:
  /#X-Amz-Target=StorageGateway_20130630.DescribeUploadBuffer:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeUploadBuffer
      description: 'Returns information about the upload buffer of a gateway. This operation is supported for the stored volume, cached volume, and tape gateway types.


        The response includes disk IDs that are configured as upload buffer space, and it includes the amount of upload buffer space allocated and used.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeUploadBufferOutput'
        '480':
          description: InvalidGatewayRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidGatewayRequestException'
        '481':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeUploadBufferInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StorageGateway_20130630.DescribeUploadBuffer
      tags:
      - '#X Amz Target=StorageGateway 20130630.DescribeUploadBuffer'
      summary: Describe upload buffer
      x-summary-source: derived
components:
  schemas:
    InternalServerError: {}
    DescribeUploadBufferInput:
      type: object
      required:
      - GatewayARN
      title: DescribeUploadBufferInput
      properties:
        GatewayARN:
          $ref: '#/components/schemas/GatewayARN'
    GatewayARN:
      type: string
      description: The Amazon Resource Name (ARN) of the gateway. Use the <a>ListGateways</a> operation to return a list of gateways for your account and Amazon Web Services Region.
      minLength: 50
      maxLength: 500
    DescribeUploadBufferOutput:
      type: object
      example:
        DiskIds:
        - pci-0000:03:00.0-scsi-0:0:0:0
        - pci-0000:04:00.0-scsi-0:1:0:0
        GatewayARN: arn:aws:storagegateway:us-east-1:111122223333:gateway/sgw-12A3456B
        UploadBufferAllocatedInBytes: 161061273600
        UploadBufferUsedInBytes: 0
      properties:
        GatewayARN:
          $ref: '#/components/schemas/GatewayARN'
        DiskIds:
          allOf:
          - $ref: '#/components/schemas/DiskIds'
          - description: An array of the gateway's local disk IDs that are configured as working storage. Each local disk ID is specified as a string (minimum length of 1 and maximum length of 300). If no local disks are configured as working storage, then the DiskIds array is empty.
        UploadBufferUsedInBytes:
          allOf:
          - $ref: '#/components/schemas/long'
          - description: The total number of bytes being used in the gateway's upload buffer.
        UploadBufferAllocatedInBytes:
          allOf:
          - $ref: '#/components/schemas/long'
          - description: The total number of bytes allocated in the gateway's as upload buffer.
    DiskIds:
      type: array
      items:
        $ref: '#/components/schemas/DiskId'
    DiskId:
      type: string
      minLength: 1
      maxLength: 300
    InvalidGatewayRequestException: {}
    long:
      type: integer
