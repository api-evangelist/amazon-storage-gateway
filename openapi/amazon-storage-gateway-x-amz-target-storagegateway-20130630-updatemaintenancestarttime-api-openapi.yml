paths:
  /#X-Amz-Target=StorageGateway_20130630.UpdateMaintenanceStartTime:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateMaintenanceStartTime
      description: Updates a gateway's weekly maintenance start time information, including day and time of the week. The maintenance time is the time in your gateway's time zone.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMaintenanceStartTimeOutput'
        '480':
          description: InvalidGatewayRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidGatewayRequestException'
        '481':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceStartTimeInput'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - StorageGateway_20130630.UpdateMaintenanceStartTime
      tags:
      - '#X Amz Target=StorageGateway 20130630.UpdateMaintenanceStartTime'
components:
  schemas:
    InternalServerError: {}
    UpdateMaintenanceStartTimeOutput:
      type: object
      example:
        GatewayARN: arn:aws:storagegateway:us-east-1:111122223333:gateway/sgw-12A3456B
      properties:
        GatewayARN:
          $ref: '#/components/schemas/GatewayARN'
      description: A JSON object containing the Amazon Resource Name (ARN) of the gateway whose maintenance start time is updated.
    DayOfMonth:
      type: integer
      minimum: 1
      maximum: 28
    InvalidGatewayRequestException: {}
    UpdateMaintenanceStartTimeInput:
      type: object
      required:
      - GatewayARN
      - HourOfDay
      - MinuteOfHour
      title: UpdateMaintenanceStartTimeInput
      properties:
        GatewayARN:
          $ref: '#/components/schemas/GatewayARN'
        HourOfDay:
          allOf:
          - $ref: '#/components/schemas/HourOfDay'
          - description: The hour component of the maintenance start time represented as <i>hh</i>, where <i>hh</i> is the hour (00 to 23). The hour of the day is in the time zone of the gateway.
        MinuteOfHour:
          allOf:
          - $ref: '#/components/schemas/MinuteOfHour'
          - description: The minute component of the maintenance start time represented as <i>mm</i>, where <i>mm</i> is the minute (00 to 59). The minute of the hour is in the time zone of the gateway.
        DayOfWeek:
          allOf:
          - $ref: '#/components/schemas/DayOfWeek'
          - description: The day of the week component of the maintenance start time week represented as an ordinal number from 0 to 6, where 0 represents Sunday and 6 Saturday.
        DayOfMonth:
          allOf:
          - $ref: '#/components/schemas/DayOfMonth'
          - description: The day of the month component of the maintenance start time represented as an ordinal number from 1 to 28, where 1 represents the first day of the month and 28 represents the last day of the month.
      description: <p>A JSON object containing the following fields:</p> <ul> <li> <p> <a>UpdateMaintenanceStartTimeInput$DayOfMonth</a> </p> </li> <li> <p> <a>UpdateMaintenanceStartTimeInput$DayOfWeek</a> </p> </li> <li> <p> <a>UpdateMaintenanceStartTimeInput$HourOfDay</a> </p> </li> <li> <p> <a>UpdateMaintenanceStartTimeInput$MinuteOfHour</a> </p> </li> </ul>
    DayOfWeek:
      type: integer
      minimum: 0
      maximum: 6
    GatewayARN:
      type: string
      description: The Amazon Resource Name (ARN) of the gateway. Use the <a>ListGateways</a> operation to return a list of gateways for your account and Amazon Web Services Region.
      minLength: 50
      maxLength: 500
    MinuteOfHour:
      type: integer
      minimum: 0
      maximum: 59
    HourOfDay:
      type: integer
      minimum: 0
      maximum: 23
